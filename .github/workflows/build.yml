name: Build GeminiSaver EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # 关键：指定用 Windows 系统打包

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 打包 EXE
      run: |
        # --noconsole: 运行时不显示黑框
        # --onefile: 打包成单文件
        pyinstaller --noconsole --onefile --name "GeminiSaver" GeminiGUI.py

    - name: 上传打包好的软件
      uses: actions/upload-artifact@v4
      with:
        name: GeminiSaver-Windows
        path: dist/GeminiSaver.exe