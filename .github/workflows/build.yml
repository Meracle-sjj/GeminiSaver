name: Build and Release

on:
  # 允许手动触发构建（方便测试）
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: 
      - "v*" # 当推送 v1.0, v1.1 这种标签时触发发布流程

permissions:
  contents: write # 允许 Action 创建 Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: GeminiSaver-Windows.exe
            exe_name: GeminiSaver.exe
          - os: macos-latest
            asset_name: GeminiSaver-MacOS
            exe_name: GeminiSaver

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name "GeminiSaver" GeminiGUI.py
    
    # 计算带有版本号的最终文件名
    - name: Define Asset Name
      id: cur_version
      shell: bash
      run: |
        VERSION="${{ github.ref_name }}"
        # 替换可能存在的非法字符(如斜杠)
        SAFE_VERSION=${VERSION//\//-}
        
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          echo "name=GeminiSaver-${SAFE_VERSION}-Windows.exe" >> $GITHUB_OUTPUT
        else
          echo "name=GeminiSaver-${SAFE_VERSION}-MacOS" >> $GITHUB_OUTPUT
        fi

    # 重命名构建产物
    - name: Rename Artifact
      run: mv dist/${{ matrix.exe_name }} dist/${{ steps.cur_version.outputs.name }}

    # 1. 普通上传：在 Action 页面可见（有效期90天）
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.cur_version.outputs.name }}
        path: dist/${{ steps.cur_version.outputs.name }}

    # 2. 正式发布：推 tag 时自动创建 GitHub Release 页
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/${{ steps.cur_version.outputs.name }}
        generate_release_notes: true