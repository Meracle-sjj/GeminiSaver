name: Build All Platforms

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    # 关键点：这里定义了一个“矩阵”，包含 Windows 和 Mac
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }} # 让 GitHub 根据矩阵自动分配电脑

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        # 这里的命令 Win/Mac 通用
        pyinstaller --noconsole --onefile --name "GeminiSaver" GeminiGUI.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        # 给产物起个不同的名字，区分是 Win 还是 Mac
        name: GeminiSaver-${{ matrix.os }}
        path: dist/GeminiSaver* # 注意：Mac 打包出来没有 .exe 后缀，用 * 通配符最省事